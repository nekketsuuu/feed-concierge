# Articles are forgotten this many days after they were first seen.
retention_days: 10

model: jev-latest
concurrency: 6

article_excerpt:
  enabled: true
  max_chars: 1500
  timeout_seconds: 8

ranking:
  # Relevance is a weighted sum of normalized Jev answers (each in 0..1), per question set.
  weights:
    default:
      interest: 0.5
      substance: 0.2
      worth_reading: 0.3
    ticket:
      kind: 0.4
      user_impact: 0.25
      interest: 0.15
      worth_reading: 0.2
    advisory:
      affects_stack: 0.35
      adoption: 0.25
      component_kind: 0.2
      worth_reading: 0.2
    changelog:
      interest: 0.5
      change_kind: 0.3
      worth_reading: 0.2
    pull_request:
      pr_kind: 0.35
      user_impact: 0.25
      interest: 0.2
      worth_reading: 0.2
  # How much each Choice option is worth (0..1) when normalizing a choice answer.
  choice_weights:
    kind:
      language_change: 1.0
      design_discussion: 0.9
      behavior_bug: 0.6
      crash_report: 0.2
      build_platform: 0.15
      housekeeping: 0.05
    change_kind:
      new_capability: 1.0
      breaking_or_deprecation: 0.9
      pricing_or_limits: 0.6
      incremental_improvement: 0.5
      fix_or_maintenance: 0.3
      regional_availability: 0.15
    component_kind:
      os_or_kernel: 0.9
      language_runtime_or_package: 1.0
      library_dependency: 1.0
      server_software: 0.9
      cloud_platform: 1.0
      dev_tooling: 0.7
      network_appliance: 0.2
      enterprise_or_consumer_product: 0.1
    pr_kind:
      new_feature: 1.0
      behavior_change_or_deprecation: 0.9
      performance: 0.7
      bug_fix: 0.5
      internal_refactor: 0.3
      docs_tests_ci: 0.1
  # Freshness follows floor + (1 - floor) / (1 + (age / half_life)^steepness): nearly flat for the
  # first day, halfway down at half_life, then a long tail. Evergreen articles get a longer half-life.
  freshness:
    half_life_hours: 120
    evergreen_half_life_bonus_hours: 48
    steepness: 2
    floor: 0.1
  # The page lists every article whose score reaches min_score, up to top_n of them.
  min_score: 0.35
  top_n: 500
  # Optional per-source caps so one busy source cannot fill the page.
  max_per_source:
    ruby_bugs: 15
    rails_prs: 10
    cisa_kev: 8
    jpcert_weekly: 8
    github_advisories: 8
    aws_security_bulletins: 8
    bleepingcomputer: 8
  # Articles below this relevance never make the page even when fresh.
  min_relevance: 0.2

# Jev answers one yes/no question per tag in config/tags.yml; tags at or above this probability are shown.
tags:
  min_probability: 0.7
  max_per_article: 3

site:
  title: "Feed Concierge"
  repository_url: https://github.com/nekketsuuu/feed-concierge
  # Times on the page are shown in this zone.
  timezone: "+09:00"
  timezone_label: JST
  # Articles seen in the browser (clicked, or scrolled past the top after seen_dwell_ms on screen) are
  # listed after the rest; forgotten after seen_ttl_days.
  seen_dwell_ms: 1500
  seen_ttl_days: 30
