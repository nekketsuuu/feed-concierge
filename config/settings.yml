sources:
  - type: hacker_news
    feeds:
      - https://hnrss.org/frontpage?count=60
      - https://hnrss.org/best?count=30
  - type: lobsters
    feeds:
      - https://lobste.rs/hottest.json
      - https://lobste.rs/newest.json
  - type: rss
    name: lwn
    feeds:
      - https://lwn.net/headlines/rss
  - type: rss
    name: phoronix
    feeds:
      - https://www.phoronix.com/rss.php
  - type: redmine
    name: ruby_bugs
    base_url: https://bugs.ruby-lang.org
    lookback_days: 3
    excerpt: false
    questions: ticket
  - type: rss
    name: github_changelog
    feeds:
      - https://github.blog/changelog/feed/
    summary_max_chars: 1200
    excerpt: false
    questions: changelog
  - type: rss
    name: aws_whats_new
    feeds:
      - https://aws.amazon.com/about-aws/whats-new/recent/feed/
    summary_max_chars: 1200
    excerpt: false
    questions: changelog
  - type: rss
    name: cloudflare_changelog
    feeds:
      - https://developers.cloudflare.com/changelog/rss/index.xml
    summary_max_chars: 1200
    max_age_days: 7
    excerpt: false
    questions: changelog
  - type: rss
    name: fastly_changelog
    feeds:
      - https://www.fastly.com/documentation/reference/changes/feed.xml
    summary_max_chars: 1200
    max_age_days: 14
    excerpt: false
    questions: changelog
  - type: github_pulls
    name: rails_prs
    repo: rails/rails
    lookback_days: 3
    base_branch: main
    excerpt: false
    questions: pull_request

model: jev-latest
concurrency: 6

article_excerpt:
  enabled: true
  max_chars: 1500
  timeout_seconds: 8

ranking:
  # Relevance is a weighted sum of normalized Jev answers (each in 0..1), per question set.
  weights:
    default:
      interest: 0.5
      substance: 0.2
      worth_reading: 0.3
    ticket:
      kind: 0.4
      user_impact: 0.25
      interest: 0.15
      worth_reading: 0.2
    changelog:
      interest: 0.5
      change_kind: 0.3
      worth_reading: 0.2
    pull_request:
      pr_kind: 0.35
      user_impact: 0.25
      interest: 0.2
      worth_reading: 0.2
  # How much each Choice option is worth (0..1) when normalizing a choice answer.
  choice_weights:
    kind:
      language_change: 1.0
      design_discussion: 0.9
      behavior_bug: 0.6
      crash_report: 0.2
      build_platform: 0.15
      housekeeping: 0.05
    change_kind:
      new_capability: 1.0
      breaking_or_deprecation: 0.9
      pricing_or_limits: 0.6
      incremental_improvement: 0.5
      fix_or_maintenance: 0.3
      regional_availability: 0.15
    pr_kind:
      new_feature: 1.0
      behavior_change_or_deprecation: 0.9
      performance: 0.7
      bug_fix: 0.5
      internal_refactor: 0.3
      docs_tests_ci: 0.1
  # Freshness decays with age since publication. Evergreen articles decay slower.
  freshness:
    half_life_hours: 18
    evergreen_half_life_bonus_hours: 30
    floor: 0.25
  # Each build in which an article appeared in the top list multiplies its score by this factor.
  exposure_decay: 0.85
  top_n: 40
  # Optional per-source caps so one busy source cannot fill the page.
  max_per_source:
    ruby_bugs: 8
    rails_prs: 6
  # Articles below this relevance never make the page even when fresh.
  min_relevance: 0.2

site:
  title: "Feed Concierge"
  source_labels:
    hacker_news: HN
    lobsters: Lobsters
    lwn: LWN
    phoronix: Phoronix
    ruby_bugs: ruby-bugs
    github_changelog: GitHub
    aws_whats_new: AWS
    cloudflare_changelog: Cloudflare
    fastly_changelog: Fastly
    rails_prs: rails PR
