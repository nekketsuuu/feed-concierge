# Tag vocabulary, loosely following Lobsters. Each description is what Jev reads when deciding
# whether the tag applies, so describe the concrete subject matter rather than a vibe.
tags:
  a11y: "Accessibility or assistive technology."
  ai: "Machine learning or AI models, training, inference, evaluation, or how such systems work internally."
  api: "Designing, implementing, or changing a programmatic API."
  cloud: "A cloud provider's service, feature, or platform (for example AWS, Cloudflare, or Fastly)."
  compilers: "Compilers, interpreters, JITs, or build toolchains and their internals."
  compsci: "Algorithms, data structures, complexity, or other theoretical computer science."
  concurrency: "Threads, async programming, actors, parallelism, or concurrency models and their bugs."
  cryptography: "Cryptographic algorithms, protocols, or their implementation and analysis."
  databases: "Databases, query engines, storage engines, or SQL."
  debugging: "A debugging investigation, post-mortem, or debugging techniques and tools."
  design: "Visual or interaction design of user interfaces."
  devops: "Deployment, CI/CD, infrastructure automation, observability, or operations."
  distributed: "Distributed systems: consensus, replication, coordination, or multi-node fault tolerance."
  editors: "Code editors, IDEs, or editor tooling."
  formalmethods: "Formal verification, proofs of software, model checking, or specification languages."
  gc: "Garbage collection or memory management strategies in language runtimes."
  graphics: "Graphics programming: rendering, GPUs, shaders, or image processing."
  hardware: "CPUs, chips, boards, devices, or other physical hardware and its design."
  historical: "History of computing or a retrospective on past technology."
  jit: "Just-in-time compilation or runtime code generation."
  linux: "The Linux kernel, distributions, or the Linux desktop."
  math: "Mathematics as the main subject."
  networking: "Network protocols, routing, DNS, TCP/IP, HTTP internals, or network infrastructure."
  osdev: "Operating system internals: kernels, drivers, schedulers, file systems, or memory management."
  performance: "Measuring or improving speed, latency, throughput, or memory use."
  plt: "Programming language theory, type systems, semantics, or language design decisions."
  privacy: "Personal data, tracking, surveillance, or privacy protections."
  release: "A software release or version announcement as the main content."
  science: "Natural science research or findings outside computing."
  security: "Vulnerabilities, exploits, attacks, or defensive security."
  testing: "Software testing, fuzzing, or test infrastructure."
  typing: "Static or gradual type systems, type checkers, or type annotations in practice."
  vcs: "Git or other version control systems and workflows."
  vibecoding: "Using AI coding assistants or agents as a tool for software development."
  visualization: "Data visualization or charting."
  web: "Web development, browsers, or web standards."
