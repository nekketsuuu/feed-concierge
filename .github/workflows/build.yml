name: Build and publish

on:
  schedule:
    - cron: "53 1-23/2 * * *"   # every two hours at :53 JST (UTC+9 -> odd UTC hours)
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Restore judgment cache
        uses: actions/cache@v6
        with:
          path: data/scores.json
          key: scores-${{ github.run_id }}
          restore-keys: scores-

      - name: Build site
        env:
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bundle exec bin/build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
